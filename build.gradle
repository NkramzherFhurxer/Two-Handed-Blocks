plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"twohandedblocks" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}


// Approved Block-Accurate v33 + protected held-item models.
// The source archive is reproducible and SHA256-verified by
// tools/stage_protected_resources.py. Its model files remain inside the
// built-in Fabric pack, NOT under the mod's root Minecraft assets.
//
// The source bundle must be committed to:
//   bundled-resources/twohanded-visuals-v33.tar.gz.b64
// A code-only build (without the archive) is allowed for development but
// is NOT a playable Hotfix 21 distribution.
def bundledResourceArchive = file("bundled-resources/twohanded-visuals-v33.tar.gz.b64")
def externalPackZip = providers.gradleProperty("twohandedPackZip").orNull

if (bundledResourceArchive.isFile()) {
    def generatedDir = layout.buildDirectory.dir("generated/bundled-item-models")
    def outputDir = layout.buildDirectory.dir(
            "generated/bundled-item-models/resourcepacks/twohanded_visuals")
    def stage = tasks.register("stageProtectedModels", Exec) {
        inputs.file(bundledResourceArchive)
        inputs.file(file("tools/stage_protected_resources.py"))
        inputs.file(file("src/client/java/com/nkramzher/twohandedblocks/client/ProtectedHeldModels.java"))
        outputs.dir(outputDir)
        commandLine("python3", "tools/stage_protected_resources.py",
                "--bundle", bundledResourceArchive.absolutePath,
                "--output", outputDir.get().asFile.absolutePath,
                "--java-rules", file("src/client/java/com/nkramzher/twohandedblocks/client/ProtectedHeldModels.java").absolutePath)
    }
    sourceSets.client.resources.srcDir(generatedDir)
    tasks.named("processClientResources").configure {
        dependsOn(stage)
    }
    // With splitEnvironmentSourceSets, sourcesJar also scans client resource
    // directories. Gradle 9 requires declaring this producer dependency.
    tasks.named("sourcesJar").configure {
        dependsOn(stage)
    }
} else if (externalPackZip != null && !externalPackZip.isBlank()) {
    // Backwards-compatible option for a local, manually supplied pack ZIP.
    // Does not create protected namespace assets; for this preview use the
    // integrated source archive above instead.
    def externalZip = file(externalPackZip)
    def generatedDir = layout.buildDirectory.dir("generated/manual-pack-models")
    def prepare = tasks.register("prepareManualItemModels") {
        inputs.file(externalZip)
        outputs.dir(generatedDir)
        doLast {
            if (!externalZip.isFile()) {
                throw new GradleException("Missing resource pack ZIP: " + externalZip)
            }
            copy {
                from zipTree(externalZip)
                into new File(generatedDir.get().asFile, "resourcepacks/twohanded_visuals")
                include "assets/**", "LICENSE.txt", "ATRIBUCION-CAMPANA.txt"
                exclude "pack.mcmeta"
            }
        }
    }
    sourceSets.client.resources.srcDir(generatedDir)
    tasks.named("processClientResources").configure {
        dependsOn(prepare)
    }
} else {
    logger.warn("Approved protected resource bundle absent: Hotfix 21 code-only build.")
}
